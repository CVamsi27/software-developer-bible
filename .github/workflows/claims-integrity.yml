# Campaign-material claims integrity.
#
# Runs scripts/check_claims.py — the gate that fails when purged
# unverifiable claim phrases (Next.js-at-Docita, invented founder bios,
# unsourceable AI specifics, DEK/KEK envelope encryption, stale n8n
# reach) re-enter ACTIVE campaign files. Pure stdlib text scan of ~15
# files: instant, so it runs on every push/PR touching the campaign
# area, not just on a schedule. Red X = a claim lost its source.
# Historical sent-record reports are allowlisted inside the script.
#
# Fallback: paths filters only exist on push/pull_request triggers; the
# scheduled/dispatch run always executes so the gate cannot silently
# stop running after a rename.
name: claims-integrity

on:
  push:
    paths:
      - '80-lanes-abroad-full-stack/personal/**'
      - 'scripts/check_claims.py'
  pull_request:
    paths:
      - '80-lanes-abroad-full-stack/personal/**'
      - 'scripts/check_claims.py'
  schedule:
    - cron: '0 7 3 * *' # 07:00 UTC on the 3rd, right after the link probe
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Claims gate
        run: |
          set +e
          python3 scripts/check_claims.py | tee claims-output.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Claims-integrity gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — no purged claim phrase re-entered active campaign files."
            else
              echo "**FAILED** — the flagged lines carry the why and the source-verified replacement wording."
            fi
            echo
            echo '```'
            cat claims-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: claims

# Verification gates: the fast, stdlib-only text scans that need no network
# and no services, so they can run on every push/PR touching markdown.
#
# The steps below run the content gates (whitespace, box geometry, template
# compliance, cross-references, duplication, topic twins, read time,
# search-page freshness, harness wiring); gate 7 (claims integrity) lives in
# claims-integrity.yml. The **final step runs `bash scripts/verify.sh`**,
# which executes the whole suite — so no gate can be silently absent from CI.
# That backstop closed a real gap: gates 1-6, 6b and 9 had no CI step at all,
# leaving count drift, misaligned tables, broken numbering, broken links,
# stale APIs, unbaselined citations and First-Principles regressions all
# green in CI.
#
# This workflow began as code-block whitespace hygiene, and the two gates it
# was built around are still documented in full:
#
# 1. check_code_whitespace.py — fails when trailing whitespace or
#    whole-block paste-shift base indents (>= 4 spaces on EVERY line of
#    a lang-tagged block) re-enter fenced code. Fix with the paired
#    fixer:
#      python3 scripts/fix_code_whitespace.py --trailing-ws --paste-shift
#    Pass by design: gofmt go tabs, Anki TSV data fences, ASCII-diagram
#    alignment in text fences, list-nested fence bases.
#
# 2. fix_box_code_indent.py --check --json --css — fails when code
#    embedded inside ASCII box diagrams sits flat at the box column
#    (de-indented), which renders as visibly broken code. Covers JS
#    (keyword-anchored), JSON, and CSS stretches; each mode is strict —
#    one non-conforming row makes a stretch invisible — and the
#    whole-stretch veto protects hand-aligned blocks. Fix with:
#      python3 scripts/fix_box_code_indent.py --fix --json --css
#    (idempotent; review the listed stretches first)
#
# Pure stdlib scans of all md files: fast, so they run on every push/PR
# touching markdown. Red X = code will render with stray whitespace or
# broken indentation.
#
# Fallback: paths filters only exist on push/pull_request triggers; the
# scheduled/dispatch run always executes so the gate cannot silently
# stop running after a rename.
name: code-whitespace

on:
  push:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'search.html'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'search.html'
  schedule:
    - cron: '0 7 4 * *' # 07:00 UTC on the 4th, right after the claims gate
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  whitespace:
    runs-on: ubuntu-latest
    # Raised from 5: the full-suite step runs every gate in one job.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Code-whitespace gate
        run: |
          set +e
          python3 scripts/check_code_whitespace.py | tee whitespace-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Code-block whitespace gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — no trailing whitespace or paste-shifted blocks in fenced code."
            else
              echo "**FAILED** — fix with: \`python3 scripts/fix_code_whitespace.py --trailing-ws --paste-shift\`"
            fi
            echo
            echo '```'
            cat whitespace-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: whitespace

      - name: Box-code indentation gate (8b)
        if: always()
        run: |
          set +e
          python3 scripts/fix_box_code_indent.py --check --json --css | tee box-indent-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Box-code indentation gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — no de-indented JS, JSON, or CSS code inside ASCII box diagrams."
            else
              echo "**FAILED** — review the listed stretches, then fix with: \`python3 scripts/fix_box_code_indent.py --fix --json --css\`"
            fi
            echo
            echo '```'
            cat box-indent-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: box-indent

      - name: Box width gate (8c)
        if: always()
        run: |
          set +e
          python3 scripts/fix_box_width.py --check | tee box-width-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Box width gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — no over-padded ASCII boxes (no screen-wrap risk)."
            else
              echo "**FAILED** — run: \`python3 scripts/fix_box_width.py --fix && python3 scripts/check_alignment.py --fix\`"
            fi
            echo
            echo '```'
            cat box-width-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: box-width

      - name: Template-compliance gate (6b)
        if: always()
        run: |
          set +e
          python3 scripts/check_template.py | tee template-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Template-compliance gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — every chapter carries its genre's required sections in canonical order."
            else
              echo "**FAILED** — add the missing sections (or fix the order) in the files below."
            fi
            echo
            echo '```'
            tail -60 template-output.txt
            echo '```'
            echo
            exit "$code"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: template-gate

      - name: Cross-reference gate (10)
        if: always()
        run: |
          set +e
          python3 scripts/check_cross_refs.py | tee cross-refs-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Cross-reference gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — every inline → N.N.N ref resolves to a real chapter."
            else
              echo "**FAILED** — fix or drop the refs below (they name no existing file ID)."
            fi
            echo
            echo '```'
            cat cross-refs-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: cross-refs

      - name: Duplication gate (11)
        if: always()
        run: |
          set +e
          python3 scripts/check_duplication.py --strict | tee dup-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Near-duplicate gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — no chapter repeats another chapter's prose."
            else
              echo "**FAILED** — merge the overlapping sections into one chapter, or scope the pair apart."
            fi
            echo
            echo '```'
            tail -40 dup-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: duplication

      - name: Topic-twin gate (12)
        if: always()
        run: |
          set +e
          python3 scripts/check_topic_twins.py | tee twins-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Topic-twin cross-link gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — every pair of chapters teaching the same topic routes to its counterpart."
            else
              echo "**FAILED** — run \`python3 scripts/link_topic_twins.py\` to write the missing links."
            fi
            echo
            echo '```'
            sed -n '/MISSING TWIN LINKS/,$p' twins-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: twins

      - name: Read-time gate (13)
        if: always()
        run: |
          set +e
          python3 scripts/read_time.py --check | tee read-time-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Read-time gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — every INDEX declares the computed study time."
            else
              echo "**FAILED** — run \`python3 scripts/read_time.py --write\` and commit the refreshed INDEX files."
            fi
            echo
            echo '```'
            tail -30 read-time-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: read-time

      - name: Search-page freshness gate (14)
        if: always()
        run: python3 scripts/gen_master_index.py --check

      # Watches the harness rather than the corpus. It belongs in CI precisely
      # because the defect it guards against produced a *green* build: gate 10
      # once wrote a variable nothing read, so an unbound-variable abort killed
      # verify.sh before its `exit $FAIL` and CI reported success on a red tree.
      - name: Harness-wiring gate (15)
        if: always()
        run: |
          set +e
          python3 scripts/check_verify_wiring.py | tee wiring-output.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Harness-wiring gate"
            echo
            if [ "$code" -eq 0 ]; then
              echo "Clean — every failure branch reaches the exit code, and the gate count agrees in verify.sh, contributing.md and docs/verification-gates.md."
            else
              echo "**FAILED** — a gate whose FAIL output cannot reach the exit code does not block anything. Use \`FAIL=1\` in the failure branch of \`scripts/verify.sh\`; if only the gate count drifted, run \`python3 scripts/check_verify_wiring.py --write\`."
            fi
            echo
            echo '```'
            tail -30 wiring-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        id: wiring

      # The backstop. The per-gate steps above exist for their readable
      # summaries; this one is the guarantee. Running the suite from one place
      # means CI cannot silently lose a gate, and it makes "a red X means a
      # gate your local run should have caught" true for *every* gate rather
      # than only the ones that happened to get their own step.
      - name: Full suite - every gate via verify.sh
        if: always()
        run: bash scripts/verify.sh

# Site build + Cloudflare Pages deploy.
#
# Build job: ALWAYS runs. It is the only executable Jekyll-render gate this
#   repo has (local Ruby lacks nokogiri; see docs/verification-gates.md).
#   Publishing safety comes from `jekyll exclude` in _config.yml, not from
#   this job (it cannot modify the artifact: it does not upload it).
# Deploy job: guarded on vars.DEPLOY_SITE_ENABLED, so it self-disarms until
#   the one-time setup in docs/deployment.md. Uses cloudflare/wrangler-action@v3.
name: deploy-site

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "_config.yml"
      - "search.html"
      - "api/**"
      - ".github/workflows/deploy-site.yml"
      - "wrangler.toml"

permissions:
  contents: read
  # jekyll-github-metadata reads GET /repos/{owner}/{repo}/pages; a 404
  # (no Pages site) is tolerated, but a 403 from missing permission is
  # re-raised and kills the build.
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Ruby 3.1, not 3.2: the locked liquid 4.0.3 (pinned by the
          # github-pages gem) still calls Object#tainted?, which Ruby 3.2
          # removed — every Liquid render would crash on 3.2.
          ruby-version: '3.1'
          bundler-cache: true   # runs `bundle install` against Gemfile.lock

      - name: Build the site (Jekyll)
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata calls the GitHub API; unauthenticated it
          # rate-limits and the failure is fatal in production mode. The
          # Actions token can read this private repo, so metadata resolves
          # exactly as on a real GH Pages build. PAGES_REPO_NWO pins the
          # repo identity (persist-credentials: false leaves no remote
          # auth, so the plugin's remote fallback is unreliable).
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: CVamsi27/software-developer-bible

      - name: Assert the lane trees are not in the built site
        run: |
          test -z "$(find _site -path '*personal*' -print -quit)"
          test ! -e _site/80-lanes-abroad-full-stack/personal
          test ! -e _site/81-lanes-indian-sde-faang/personal
          echo "lane exclusion verified in _site/"

      - name: Assert front page and search rendered
        run: test -s _site/index.html && test -s _site/search.html

      # Deploy stays a no-op until vars.DEPLOY_SITE_ENABLED=true AND the
      # CF_API_TOKEN + CF_ACCOUNT_ID secrets exist (docs/deployment.md).
  deploy:
    needs: build
    if: ${{ vars.DEPLOY_SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy _site --project-name=bible --branch=main --commit-dirty=true

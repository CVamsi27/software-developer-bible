# Site build gate for the Cloudflare Pages Git integration.
#
# Publishing path: Cloudflare Pages pulls this repo directly (Connect to
#   Git, project `software-developer-bible`) and runs `bundle exec jekyll build` itself on
#   every push to main — so there is intentionally NO deploy job here: no
#   wrangler step, no token, no secret. The dashboard holds the build
#   config; `.ruby-version` pins Ruby 3.1 (the locked liquid 4.0.3 calls
#   Object#tainted?, removed in Ruby 3.2). See docs/deployment.md.
# This workflow: ALWAYS runs the same render as a safety gate. Pages has
#   no Liquid-warning or lane-exclusion guards, so this job is the
#   backstop: if it goes red beside a green Pages build, roll the Pages
#   deployment back from the Cloudflare dashboard (Deployments → select a
#   prior deployment → Rollback).
name: site-build

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "_config.yml"
      - "search.html"
      - "api/**"
      # The edge half of the artifact. Cloudflare's Git integration builds on
      # every push to main regardless of paths, so these files already deploy —
      # but a push that *only* touched them skipped this backstop (the render,
      # the lane-exclusion assertion, the Liquid-warning guard) for exactly the
      # pushes that change what the edge serves. Rule 11 of
      # scripts/check_verify_wiring.py now checks this list.
      - "functions/**"
      - "auth/**"
      - ".github/workflows/site-build.yml"
      - "wrangler.toml"
      - ".ruby-version"
  # Gemfile changes don't match the push paths; dispatch covers those.
  workflow_dispatch:

permissions:
  contents: read
  # jekyll-github-metadata reads GET /repos/{owner}/{repo}/pages; a 404
  # (no Pages site) is tolerated, but a 403 from missing permission is
  # re-raised and kills the build.
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Ruby 3.1, not 3.2: the locked liquid 4.0.3 (pinned by the
          # github-pages gem) still calls Object#tainted?, which Ruby 3.2
          # removed — every Liquid render would crash on 3.2.
          ruby-version: '3.1'
          bundler-cache: true   # runs `bundle install` against Gemfile.lock

      - name: Build the site (Jekyll)
        run: |
          set -o pipefail
          bundle exec jekyll build --trace 2>&1 | tee /tmp/jekyll-build.log
        env:
          JEKYLL_ENV: production
          # jekyll-github-metadata calls the GitHub API; unauthenticated it
          # rate-limits and the failure is fatal in production mode. The
          # Actions token can read this private repo, so metadata resolves
          # exactly as on a real GH Pages build. PAGES_REPO_NWO pins the
          # repo identity (persist-credentials: false leaves no remote
          # auth, so the plugin's remote fallback is unreliable).
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: CVamsi27/software-developer-bible

      - name: Fail on Liquid warnings (silent-empty-render guard)
        run: |
          # A Liquid WARNING does not fail the build — the template syntax in
          # a chapter ({{ width: '100%' }}) just renders as empty text and
          # ships. This gate turns that class fatal.
          if grep -E "Liquid (Warning|Exception)" /tmp/jekyll-build.log; then
            echo "::error::Liquid warning above — a chapter's literal {{ }} collided with Liquid. Raw-wrap the file listed ({% raw %} line 1, {% endraw %} EOF)."
            exit 1
          fi
          echo "no Liquid warnings in the render"

      - name: Assert the lane trees are not in the built site
        run: |
          test -z "$(find _site -path '*personal*' -print -quit)"
          test ! -e _site/80-lanes-abroad-full-stack/personal
          test ! -e _site/81-lanes-indian-sde-faang/personal
          echo "lane exclusion verified in _site/"

      - name: Assert front page and search rendered
        run: test -s _site/index.html && test -s _site/search.html

      # No deploy job by design: Cloudflare Pages builds straight from git
      # (docs/deployment.md). A red gate beside a green Pages build means
      # the live deployment skipped these guards — roll it back.

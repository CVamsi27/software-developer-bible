name: study-access

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Study access policy tests
        run: node --test functions/_lib/study-access.test.mjs

      # The adapter, not just the policy: _middleware.ts is the only file in the
      # feature that no other suite touches, so a typo in its URL parse or
      # cookie read used to be invisible until a request hit production.
      - name: Pages middleware adapter tests
        run: node --experimental-strip-types --test functions/_middleware.test.mjs

      # The three routes the sign-in flow is made of, offline. session.ts
      # decides who gets the cookie and what is stored in it; it used to be
      # exercised only by a real Google sign-in, which CI cannot drive.
      - name: Auth route tests
        run: node --experimental-strip-types --test functions/auth/routes.test.mjs
      - name: Reject client-side token persistence
        run: |
          if grep -RInE 'localStorage.*(access_token|study_access_token)|(access_token|study_access_token).*localStorage' auth functions; then
            echo 'Study access tokens must stay in the HttpOnly cookie flow.'
            exit 1
          fi

# Live deployment contract check for the private study host.
#
# Every other gate looks at the corpus or the local render; none looks at what
# Cloudflare actually serves. That blind spot is not theoretical: on
# 2026-09-22 production was a commit behind HEAD (the canonical-host redirect
# never reached it) and `/auth/start` answered 503, through 26 green gates and
# a green Pages build.
#
# scripts/check_study_live.py probe-verifies the contract in
# docs/deployment.md: gating on every protected path with deep links preserved,
# no unauthenticated content, a minimal public auth surface, canonicalization of
# the `.pages.dev` fallback, a denial redirect for an invalid session, a working
# sign-in redirect, and a logout that clears the session. Warnings (sign-in not
# configured, a dead denial host) are dashboard state and never fail a run; only
# a contract violation does.
#
# Two jobs, two triggers, because the halves have different needs:
#   offline — hermetic and fast (stub hosts, no network), so it runs on every
#     change to its own inputs. A probe whose classification nobody checks at
#     review time is how a check that can only report success ships.
#   live — must not race the Pages build it measures (both build from git), so
#     it is scheduled rather than push-triggered. Dispatch it manually once a
#     deploy has settled.
name: study-live

on:
  push:
    paths:
      - 'scripts/check_study_live.py'
      - 'scripts/test_study_live.py'
      # The probe's subject. A change to the edge is a change to the contract
      # this workflow checks, so the hermetic offline job runs on it; the live
      # job stays scheduled/manual so it can never race the deploy it measures.
      # Rule 11 of scripts/check_verify_wiring.py checks this list.
      - 'functions/**'
      - 'auth/**'
      - '.github/workflows/study-live.yml'
  schedule:
    - cron: '0 7 * * 1' # Mondays 07:00 UTC — a stale deployment cannot outlive a week
  workflow_dispatch: {}

permissions:
  contents: read
  # A violated contract opens (or refreshes) a tracking issue. The live job is
  # schedule-only, so a red X here is a signal nobody is looking at — the same
  # reasoning that made link-rot-audit and drift-drill file an issue instead.
  issues: write

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pin the probe contract (stub hosts, no network)
        run: python3 scripts/test_study_live.py

  live:
    # Skipped on push: a probe racing the deploy it measures would report the
    # previous deployment. It still gates the scheduled and manual runs.
    if: github.event_name != 'push'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Probe the live study host
        # STUDY_PROBE_TOKEN (repo secret, mirrored in the Pages project) is
        # what lets this assert the success path: a real chapter, served to a
        # valid session. Unset, the probe warns instead of failing, because an
        # absent secret is operator state, not a contract violation.
        env:
          STUDY_PROBE_TOKEN: ${{ secrets.STUDY_PROBE_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/check_study_live.py --verbose | tee live-check.txt

      - name: Attach the probe log to the run summary
        if: always()
        run: |
          {
            echo "## Live study-host contract"
            echo
            echo '```'
            cat live-check.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Needs the repository's Issues feature. It is disabled on this repo today,
      # so the has_issues guard below turns both issue steps into no-ops and the
      # run summary is the record of a violation. Enable Issues (Settings →
      # General → Features) and they become real tracking issues; the guard is
      # what keeps a disabled feature from turning a working workflow red.
      - name: Track a violated contract as an issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const repoInfo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (!repoInfo.data.has_issues) {
              core.notice('Issues are disabled — the probe log is in the run summary.');
              return;
            }
            const fs = require('fs');
            const log = fs.readFileSync('live-check.txt', 'utf8');
            const title = 'Live study-host contract violated';
            const body =
              'A probe of production found the deployment contradicting ' +
              '`docs/deployment.md` §2/§3.\n\n' +
              'Fix forward and re-deploy (Pages builds from git on every push ' +
              'to main), or roll the deployment back from the Cloudflare ' +
              'dashboard. If the probe itself is wrong, fix the probe — do not ' +
              'silence it.\n\n<details><summary>Probe log</summary>\n\n```\n' +
              log + '\n```\n</details>\n';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment-contract',
            });
            const prior = existing.data.find(i => i.title === title);
            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deployment-contract'],
              });
            }

      - name: Close the issue when the contract holds
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const repoInfo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            if (!repoInfo.data.has_issues) {
              return;
            }
            const title = 'Live study-host contract violated';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment-contract',
            });
            const prior = existing.data.find(i => i.title === title);
            if (prior) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prior.number,
                body: 'The live probe matches the documented contract again; closing.',
              });
            }

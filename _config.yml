title: Software Developer Bible
tagline: Senior Full Stack Interview Bible
description: >-
  A lane-first, stack-deep reference for senior full-stack engineers (5+ YoE)
  prepping for product-based companies, FAANG/Big Tech, and EU mid-stage startups.
author: CVamsi27
url: https://study.buildora.work
theme: minima
header_pages:
  - INDEX.md
  - search.md
  - 00-strategy/INDEX.md
  - lanes/INDEX.md
  - 10-frontend/INDEX.md
  - 20-backend/INDEX.md
  - 30-architecture/INDEX.md
  - 40-platform/INDEX.md
  - 50-quality/INDEX.md
  - 60-realtime/INDEX.md
  - 70-interview-toolkit/INDEX.md
  - 80-lanes-abroad-full-stack/INDEX.md
  - 81-lanes-indian-sde-faang/INDEX.md
minima:
  skin: auto
show_excerpts: false
markdown: kramdown
# Plugin allowlist. The github-pages gem whitelist-activates EVERY bundled
# plugin, including jekyll-optional-front-matter, which force-renders all
# markdown through Liquid — any literal {{ }} in a chapter would crash the
# build (or silently render empty, which is worse). This site serves the
# corpus as verbatim static files by design; only the homepage uses theme
# layouts, and minima's needs stay listed here.
plugins:
  - jekyll-seo-tag
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
  # vendor/ is where `bundle install` (CI bundler-cache) puts gems inside the
  # checkout; Jekyll 3.9's default excludes don't cover it and it would crawl
  # the jekyll gem's own site_template/_posts and die on its ERB date.
  - vendor
  # Private career data — never publish (docs/deployment.md). The CI gate
  # in site-build.yml asserts these never appear in _site/.
  - 80-lanes-abroad-full-stack/personal
  - 81-lanes-indian-sde-faang

# Content pages are rendered with the Minima theme (like the homepage).
# github-metadata is disabled: it made every page's seo/social render hit
# the GitHub API and stretched builds to ~19 min in the cloud.
github: [metadata: false]
readme_index: { enabled: false }

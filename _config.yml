title: Software Developer Bible
tagline: Senior Full Stack Interview Bible
description: >-
  A lane-first, stack-deep reference for senior full-stack engineers (5+ YoE)
  prepping for product-based companies, FAANG/Big Tech, and EU mid-stage startups.
author: CVamsi27
url: https://study.buildora.work
theme: minima
header_pages:
  - INDEX.md
  - 00-strategy/INDEX.md
  - lanes/INDEX.md
  - 10-frontend/INDEX.md
  - 20-backend/INDEX.md
  - 30-architecture/INDEX.md
  - 40-platform/INDEX.md
  - 50-quality/INDEX.md
  - 60-realtime/INDEX.md
  - 70-interview-toolkit/INDEX.md
  - 80-lanes-abroad-full-stack/INDEX.md
  - 81-lanes-indian-sde-faang/INDEX.md
minima:
  skin: auto
show_excerpts: false
markdown: kramdown
exclude:
  - Gemfile
  - Gemfile.lock

# Content pages are rendered with the Minima theme (like the homepage).
# github-metadata is disabled: it made every page's seo/social render hit
# the GitHub API and stretched builds to ~19 min in the cloud.
github: [metadata: false]
readme_index: { enabled: false }

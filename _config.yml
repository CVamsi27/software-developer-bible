title: Software Developer Bible
tagline: Senior Full Stack Interview Bible
description: >-
  A lane-first, stack-deep reference for senior full-stack engineers (5+ YoE)
  prepping for product-based companies, FAANG/Big Tech, and EU mid-stage startups.
author: CVamsi27
url: https://study.buildora.work
# Served at the domain root. Explicitly empty (not omitted): an unset baseurl
# lets jekyll-github-metadata install a lazy baseurl Value that needs the
# GitHub API to render — see the `github:` block below.
baseurl: ""

# Single owner of the shared theme script's load path (rule 13,
# scripts/check_verify_wiring.py). _includes/head-custom.html resolves it
# through relative_url for Jekyll pages; scripts/gen_master_index.py emits it
# document-relative so the committed search page also works from file://.
# Do not restate the path in either consumer.
theme_asset: /assets/theme.js
# Bump when theme behavior changes so cached clients receive the same header.
theme_version: reader-final-4
theme: minima
header_pages:
  - INDEX.md
  - search.md
  - ROADMAP.md
  - lanes/INDEX.md
  - 00-strategy/INDEX.md
minima:
  skin: auto
show_excerpts: false
markdown: kramdown
# Theme dependencies. The pinned github-pages command also loads
# jekyll-optional-front-matter and renders Markdown chapters as HTML.
# Chapters containing literal Liquid syntax use raw wrappers; the template
# gate and production-build warning check protect those examples.
plugins:
  - jekyll-seo-tag
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
  # vendor/ is where `bundle install` (CI bundler-cache) puts gems inside the
  # checkout; Jekyll 3.9's default excludes don't cover it and it would crawl
  # the jekyll gem's own site_template/_posts and die on its ERB date.
  - vendor
  # Never publish (docs/deployment.md) — the CI gate in site-build.yml
  # asserts nothing personal ever appears in _site/.
  - 81-lanes-indian-sde-faang
  # Internal audit evidence includes private source-path inventories.
  - docs/2026-10-10-senior-precision-audit.json
  - docs/2026-10-10-senior-precision-validation.json

# Content pages are rendered with the Minima theme (like the homepage).
# jekyll-github-metadata (auto-required by the github-pages gem) has NO
# disable flag — its SiteGitHubMunger always runs. It stays harmless by
# construction instead, verified against the pinned
# jekyll-github-metadata 2.13.0 source (re-verify
# lib/jekyll-github-metadata/site_github_munger.rb if the lockfile ever
# upgrades the plugin):
#   * `github:` is an Array, not a Hash, so github_namespace() returns it
#     untouched and no MetadataDrop (no API object) is ever built. (The
#     `metadata: false` element is ignored by the plugin; the Array shape
#     is the load-bearing part. Nothing in this repo reads site.github.)
#   * url/title/description/baseurl are all set explicitly above, so
#     munge!() assigns zero lazy Values (every ||= / should_set_baseurl?
#     check skips). Previously the unset baseurl installed a Value whose
#     render called the GitHub API and killed token-less builds with
#     "No repo name found" (in production the git remote is never
#     consulted — only PAGES_REPO_NWO or `repository` in config count).
# Net: the plugin never detects a repo and never calls the GitHub API — no
# token and no PAGES_REPO_NWO needed on Cloudflare Pages.
github: [metadata: false]
readme_index: { enabled: false }

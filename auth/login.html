<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Study // Buildora</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1114; color: #f1f7f4; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 10% 0%, #16383a, transparent 42%), #0b1114; }
      main { width: min(100%, 480px); border: 1px solid #2f5154; padding: clamp(24px, 7vw, 48px); background: #111b1e; box-shadow: 0 24px 80px #0008; }
      .mark { color: #c8ff3d; font-size: 12px; font-weight: 800; letter-spacing: .18em; }
      h1 { margin: 48px 0 12px; font-size: clamp(36px, 10vw, 60px); letter-spacing: -.06em; line-height: .9; text-transform: uppercase; }
      p { color: #a7b9b5; line-height: 1.6; }
      a.button { display: inline-flex; width: 100%; min-height: 52px; align-items: center; justify-content: center; margin-top: 24px; border: 1px solid #c8ff3d; background: #c8ff3d; color: #081014; font-weight: 800; text-decoration: none; }
      small { display: block; margin-top: 18px; color: #6f8886; line-height: 1.5; }
      .error { color: #ffb98a; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">BUILDORA // STUDY</div>
      <h1>Study with intent.</h1>
      <p>This is a private engineering reference for the Buildora study lane. Continue with the approved Google account to open the corpus.</p>
      <a id="continue" class="button" href="/auth/start">Continue with Google</a>
      <small>Access is limited to the owner account. Other accounts return to Personal Buildora.</small>
      <p id="error" class="error" hidden></p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const rawNext = params.get("next") || "";
      let next = (rawNext.startsWith("/") && !rawNext.startsWith("//") && !rawNext.includes("\\\\")) ? rawNext : "/";

      try {
        if (!next || next === "/") {
          const prior = sessionStorage.getItem("study_next_url") || localStorage.getItem("study_next_url");
          if (prior && prior.startsWith("/") && !prior.startsWith("//")) {
            next = prior;
          }
        } else {
          sessionStorage.setItem("study_next_url", next);
          localStorage.setItem("study_next_url", next);
          document.cookie = "study_next_url=" + encodeURIComponent(next) + "; Path=/; SameSite=Lax; Max-Age=1800";
        }
      } catch (e) {}

      const continueBtn = document.getElementById("continue");
      continueBtn.href = "/auth/start?next=" + encodeURIComponent(next);

      if (window.self !== window.top) {
        continueBtn.target = "_top";
        const note = document.createElement("p");
        note.style.fontSize = "12px";
        note.style.color = "#c8ff3d";
        note.style.marginTop = "12px";
        note.textContent = "Embedded mode: Continue opens in top window to authorize with Google, then returns you to this exact chapter.";
        continueBtn.parentNode.insertBefore(note, continueBtn.nextSibling);
      }

      if (params.get("error")) {
        const error = document.getElementById("error");
        error.hidden = false;
        error.textContent = "Google sign-in was not completed. Please try again.";
      }
    </script>
  </body>
</html>

# Cloudflare Pages project — software-developer-bible
# Git-integrated: Cloudflare pulls this repo directly (Connect to Git) and
# builds it on every push to main. The dashboard holds the build config
# (build command `bundle exec jekyll build`, output `_site`,
# JEKYLL_ENV=production); Ruby 3.1 comes from the `.ruby-version` file.
# Full setup lives in docs/deployment.md. This file only pins the project
# name for manual `wrangler pages` CLI use (e.g. `wrangler pages dev`).
# There is no Worker here — NEVER run `wrangler deploy` (it fails with
# "Missing entry-point to Worker script").
name = "software-developer-bible"
compatibility_date = "2026-09-01"
